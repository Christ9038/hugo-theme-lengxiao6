baseURL = "http://localhost:1313/"
languageCode = "zh-cn"
title = "六叔资源站"
theme = "hugo-theme"
themesDir = "../.."
enableRobotsTXT = true

[taxonomies]
  category = "categories"
  tag = "tags"
  series = "series"
  author = "authors"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.goldmark]
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\\[', '\\]'], ['$$', '$$']]
          inline = [['$', '$'], ['\\(', '\\)']]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
    lineNos = true
    lineNumbersInTable = true

[params]
  description = "探索 AI 与科技，分享实践和方法。"
  [params.Author]
    name = "不爱折腾的六叔"
    headline = "探索 AI 与科技，分享副业与生活。"
    image = "img/avatar.svg"
    links = [
      { bilibili = "https://space.bilibili.com/197587769" },
      { douyin = "https://www.douyin.com/" },
      { xiaohongshu = "https://www.xiaohongshu.com/" },
      { youtube = "https://www.youtube.com/" },
      { x = "https://x.com/" }
    ]

  [params.footer]
    icp = "京ICP备00000000号-1"
    publicSecurity = "京公网安备11000000000000号"
    publicSecurityUrl = "https://beian.mps.gov.cn/"
  [params.home]
    eyebrow = "AI · 科技 · 实践"
    title = "记录实践，分享方法"
    description = "一个安静、清晰、适合长期积累的中文内容空间。"
    bannerInterval = 4600
    [[params.home.banners]]
      image = "img/banner-ai.jpg"
      title = "探索 AI 与科技"
      description = "记录实践，分享方法"
      link = "/categories/AI/"
    [[params.home.banners]]
      image = "img/banner-workflow.jpg"
      title = "把工具变成工作流"
      description = "从一个问题开始，找到可复用的路径"
      link = "/posts/ai-workflow/"
    [[params.home.banners]]
      image = "img/banner-system.jpg"
      title = "建立长期积累的系统"
      description = "让内容、工具和经验持续沉淀"
      link = "/posts/side-hustle/"
    [[params.home.sections]]
      key = "featured"
      source = "manual"
      order = 10
      title = "精选文章"
      description = "值得优先阅读的内容"
      href = "/posts/"
      limit = 4
      layout = "featured"
    [[params.home.sections]]
      key = "ai"
      source = "category"
      category = "AI"
      order = 20
      title = "AI 实践"
      description = "AI 工具、教程与实践记录"
      href = "/categories/AI/"
      limit = 6
      layout = "grid"
    [[params.home.sections]]
      key = "recent"
      source = "recent"
      order = 90
      title = "最近的文章"
      description = "按时间浏览最新发布的内容"
      href = "/posts/"
      limit = 6
      layout = "featured"

[permalinks]
  posts = "/posts/:slug/"
