<footer class="site-footer">
  <div class="shell footer-inner">
    <div class="footer-copyright">© {{ now.Year }} {{ site.Title }}</div>
    <div class="footer-records">
      {{ with site.Params.footer.icp }}<a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">{{ . }}</a>{{ end }}
      {{ with site.Params.footer.publicSecurity }}<a class="footer-security-link" href="{{ site.Params.footer.publicSecurityUrl | default "https://beian.mps.gov.cn/" }}" target="_blank" rel="noopener noreferrer"><img src="{{ "img/police.png" | relURL }}" alt="" aria-hidden="true">{{ . }}</a>{{ end }}
      {{ with site.Params.footer.text }}<span>{{ . }}</span>{{ end }}
    </div>
  </div>
</footer>
