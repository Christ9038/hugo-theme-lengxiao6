<header class="site-header">
  <div class="shell header-inner">
    <a class="brand" href="{{ site.Home.RelPermalink }}">
      {{ with site.Params.Author.image }}<img src="{{ . | relURL }}" alt="">{{ end }}
      <span><strong>{{ site.Title }}</strong><small>{{ site.Params.Author.headline | default "记录实践，分享方法" }}</small></span>
    </a>
    <nav aria-label="主导航">
      <a href="{{ "posts/" | relURL }}">文章</a>
      <a href="{{ "categories/" | relURL }}">分类</a>
      <a href="{{ "tags/" | relURL }}">标签</a>
      {{ with site.Menus.main }}{{ range . }}<a href="{{ .URL }}">{{ .Name }}</a>{{ end }}{{ end }}
    </nav>
    <div class="header-tools">
      <a class="search-link" href="{{ "search/" | relURL }}">搜索文章</a>
      <button class="icon-button" data-theme-toggle aria-label="切换主题">◐</button>
    </div>
  </div>
</header>
