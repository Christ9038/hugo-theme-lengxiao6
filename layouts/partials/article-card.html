<article class="article-card">
  {{ with .Params.featuredImage }}<a class="card-image" href="{{ $.RelPermalink }}"><img src="{{ . | relURL }}" alt="" loading="lazy"></a>{{ end }}
  <div class="card-body">
    <div class="card-meta"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "01-02" }}</time>{{ with index .Params.articleType 0 }}<span>{{ . }}</span>{{ end }}</div>
    <h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
    <p>{{ .Description | default .Summary | plainify | truncate 100 }}</p>
    <div class="tags">{{ with .Params.tags }}{{ range first 3 . }}<span>{{ . }}</span>{{ end }}{{ end }}</div>
  </div>
</article>
