{{ define "main" }}<article class="shell article-single"><header><p class="eyebrow">{{ with index .Params.categories 0 }}{{ . }}{{ end }}</p><h1>{{ .Title }}</h1><p class="article-lede">{{ .Description }}</p><div class="card-meta"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time>{{ with site.Params.Author.name }}<span>{{ . }}</span>{{ end }}</div></header><div class="article-content">{{ .Content }}</div><footer class="article-footer">{{ range .Params.tags }}<a href="{{ (printf "tags/%s/" (. | urlize)) | relURL }}">#{{ . }}</a>{{ end }}</footer></article>{{ end }}
